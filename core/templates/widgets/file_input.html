{% if widget.is_initial %}<div class="small text-body-secondary mb-1"><i class="bi bi-paperclip"></i> Fichier actuel : {{ widget.value }}{% if not widget.required %}
  <span class="form-check form-check-inline ms-2"><input type="checkbox" class="form-check-input" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}><label class="form-check-label" for="{{ widget.checkbox_id }}">Supprimer</label></span>{% endif %}</div>{% endif %}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>

{% load static %}<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erreur</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script>try{var t=localStorage.getItem('em-theme');if(t){document.documentElement.setAttribute('data-bs-theme',t)}}catch(e){}</script>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="text-center p-4" style="max-width:520px">
    <div class="stat-icon tone-primary mx-auto mb-3" style="width:80px;height:80px;border-radius:20px;display:grid;place-items:center;font-size:2.2rem"><i class="bi {% block icon %}bi-exclamation-circle{% endblock %}"></i></div>
    <div class="text-body-secondary fw-semibold">Erreur {% block code %}{% endblock %}</div>
    <h1 class="h3 fw-bold">{% block heading %}{% endblock %}</h1>
    <p class="text-body-secondary">{% block text %}{% endblock %}</p>
    <div class="d-flex justify-content-center gap-2">
      <a class="btn btn-outline-secondary" href="javascript:history.back()"><i class="bi bi-arrow-left"></i> Retour</a>
      <a class="btn btn-primary" href="/"><i class="bi bi-house"></i> Accueil</a>
    </div>
  </div>
</body>
</html>
